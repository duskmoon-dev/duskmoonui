name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
        type: string
      git_ref:
        description: 'Git ref to release from'
        required: true
        default: 'main'
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install

      - name: Update versions in all packages
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ inputs.version }}';
            const packages = ['packages/core', 'packages/css-art'];
            for (const dir of packages) {
              const path = \`\${dir}/package.json\`;
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkg.version = version;
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
              console.log('Updated', pkg.name, 'to', version);
            }
          "

      - name: Build all packages
        run: bun run build:core && bun run build:css-art

      # Rekor keys provenance by tarball digest. A failed first attempt
      # records that digest, so retries of the same files 409 forever.
      - name: Uniquify publish tarball
        run: |
          for pkg in packages/core packages/css-art; do
            printf '\n<!-- release %s -->\n' "${GITHUB_RUN_ID}" >> "${pkg}/README.md"
          done

      - name: Publish @duskmoon-dev/core
        working-directory: packages/core
        run: bash ../../.github/scripts/npm-publish.sh

      - name: Publish @duskmoon-dev/css-art
        working-directory: packages/css-art
        run: bash ../../.github/scripts/npm-publish.sh

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json packages/css-art/package.json
          if git diff --cached --quiet; then
            echo "No version changes to commit (already up to date)"
          else
            git commit -m "chore(release): v${{ inputs.version }}"
            git push origin HEAD:${{ inputs.git_ref }}
          fi

      - name: Create git tag
        run: |
          TAG="v${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping creation"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG" --force

      - name: Generate release notes
        run: |
          VERSION="v${{ inputs.version }}"
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -v "^${VERSION}$" | head -1)

          {
            echo "## What's Changed"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges
            else
              git log --pretty=format:"- %s" --no-merges -20
            fi

            echo ""
            echo ""
            echo "## Packages"
            echo ""
            echo "| Package | Version |"
            echo "|---------|---------|"
            echo "| \`@duskmoon-dev/core\` | \`${{ inputs.version }}\` |"
            echo "| \`@duskmoon-dev/css-art\` | \`${{ inputs.version }}\` |"
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "npm install @duskmoon-dev/core@${{ inputs.version }}"
            echo "npm install @duskmoon-dev/css-art@${{ inputs.version }}"
            echo '```'

            echo ""
            echo "## Standalone Tailwind CLI"
            echo ""
            echo "Download the ESM plugin and complete Core + CSS Art stylesheet beside the Tailwind standalone executable:"
            echo ""
            echo '```bash'
            echo "curl -sLO https://github.com/duskmoon-dev/duskmoonui/releases/download/${VERSION}/duskmoonui.mjs"
            echo "curl -sLO https://github.com/duskmoon-dev/duskmoonui/releases/download/${VERSION}/duskmoonui.css"
            echo '```'
            echo ""
            echo 'A themes-only bundle is also available as `duskmoonui-themes.css`.'
            echo ""
            echo "Then load them from your CSS:"
            echo ""
            echo '```css'
            echo '@import "./duskmoonui.css";'
            echo '@plugin "./duskmoonui.mjs";'
            echo '```'

            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/duskmoon-dev/duskmoonui/compare/${PREV_TAG}...${VERSION}"
            fi
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file release_notes.md \
            --verify-tag \
            packages/core/dist/standalone/duskmoonui.js \
            packages/core/dist/standalone/duskmoonui.mjs \
            packages/core/dist/standalone/duskmoonui.css \
            packages/core/dist/standalone/duskmoonui-themes.css
